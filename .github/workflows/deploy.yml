name: Deploy Telegram Serverless

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - tgcloud/**
      - tgcloud.json
      - package.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: forecast-tgcloud-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm create @tgcloud/bot tFORECASTbot
      - run: |
          rm -rf tFORECASTbot/tgcloud
          cp -R tgcloud tFORECASTbot/tgcloud
          cp -R app tFORECASTbot/app
          cp tgcloud.json tFORECASTbot/tgcloud.json
          rm -f tFORECASTbot/tgcloud.jsonc
      - run: npx tgcloud push
        working-directory: tFORECASTbot
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}

