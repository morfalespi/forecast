name: Deploy Forecast to Telegram Serverless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-telegram-serverless
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLI
        run: npm install --no-audit --no-fund
      - name: Run local tests
        run: npm test
      - name: Validate Telegram Serverless CLI token
        shell: bash
        run: |
          set -euo pipefail
          # docs/telegram-serverless.md#authentication: app<id>:<secret>.
          # Do not transform, echo or persist the credential.
          if [[ ! "${TGCLOUD_TOKEN:-}" =~ ^app[^:[:space:]]+:[^[:space:]]+$ ]]; then
            echo "::error title=Telegram Serverless CLI credential::TGCLOUD_TOKEN is missing or does not match the documented CLI token format app<id>:<secret>. The credential was not displayed."
            exit 1
          fi
      - name: Publish Serverless modules
        run: npx tgcloud push
      - name: Apply additive database changes
        run: npx tgcloud migrate --safe
      - name: Synchronize webhook with handlers
        run: npx tgcloud webhook sync
      - name: Report webhook status
        run: npx tgcloud webhook
