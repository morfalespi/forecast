name: Deploy Forecast to Telegram Serverless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-telegram-serverless
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ vars.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create Telegram Serverless project with official scaffold
        env:
          npm_config_yes: 'true'
        run: npm create @tgcloud/bot .
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run local tests
        run: npm test
      - name: Publish Serverless modules
        run: npx tgcloud push
      - name: Apply additive database changes
        run: npx tgcloud migrate --safe
      - name: Synchronize webhook with handlers
        run: npx tgcloud webhook sync
      - name: Report webhook status
        run: npx tgcloud webhook
