name: Deploy Forecast to Telegram Serverless

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-telegram-serverless
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLI
        run: npm install --no-audit --no-fund
      - name: Run local tests
        run: npm test
      - name: Validate Telegram Serverless CLI credential
        shell: bash
        run: |
          set -euo pipefail
          # CLI token is app<id>:<secret>; never print it.
          # A copied line break or surrounding quotes is not part of the token.
          token="$(printf '%s' "$TGCLOUD_TOKEN" | tr -d '\r\n')"
          if [[ "$token" == \"*\" ]] || [[ "$token" == \'*\' ]]; then
            token="${token:1:${#token}-2}"
          fi
          if [[ ! "$token" =~ ^app[0-9]+:[^[:space:]]+$ ]]; then
            echo "::error title=Credencial Telegram Serverless inválida::TGCLOUD_TOKEN não corresponde ao formato de token CLI app<id>:<secret> exigido pela documentação. O valor não foi exibido."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'TGCLOUD_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Publish Serverless modules
        run: npx tgcloud push
      - name: Apply additive database changes
        run: npx tgcloud migrate --safe
      - name: Synchronize webhook with handlers
        run: npx tgcloud webhook sync
      - name: Report webhook status
        run: npx tgcloud webhook
